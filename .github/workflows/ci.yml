name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev]'
      - run: python -m pytest
      - name: Validate both TrueNAS app definitions
        run: |
          for environment in sandbox production; do
            python deploy/render.py "$environment" --image "ghcr.io/${GITHUB_REPOSITORY,,}/truenas:${GITHUB_SHA}" > "/tmp/product-finder-$environment.json"
            jq -r '.services[].env_file[]?' "/tmp/product-finder-$environment.json" | xargs -r -n 1 sudo install -D -m 0644 /dev/null
            docker compose -f "/tmp/product-finder-$environment.json" config --quiet
          done

  docker:
    name: Publish environment image
    needs: quality
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
