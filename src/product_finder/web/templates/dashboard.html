{% extends "base.html" %}
{% block title %}Dashboard — Product Finder{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Dashboard</h1>
    <p class="meta">
      {{ cfg.postcode or '—' }} · {{ cfg.radius_miles }}-mile radius ·
      <a href="{{ url_for('source_list') }}">Sources</a>
    </p>
    <p class="meta" id="search-status" role="status">{{ search_status.message }}</p>
  </div>
</div>

<div id="dashboard-live" data-activity="{{ last_activity or '' }}" data-expiry="{{ last_expiry or '' }}"
     data-live-url="{{ url_for('dashboard_live') }}" data-status-url="{{ url_for('api_status') }}">
{% include "_dashboard_live.html" %}
</div>
{% endblock %}
